name: Keep Streamlit App Awake

# Streamlit Community Cloud membuat aplikasi "tidur" jika tidak ada
# traffic selama 12 jam. Workflow ini mengunjungi URL aplikasi setiap
# 6 jam supaya jam tidak pernah mencapai 12 jam, sehingga aplikasi
# tetap terjaga tanpa perlu diklik "wake up" secara manual.

on:
  schedule:
    - cron: "0 */6 * * *"   # setiap 6 jam
  workflow_dispatch: {}       # bisa dijalankan manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app URL
        run: |
          curl -sS -L -o /dev/null -w "HTTP status: %{http_code}\n" \
            --retry 3 --retry-delay 10 \
            "${{ secrets.STREAMLIT_APP_URL }}"
